<script>
  let deferredPrompt;

  window.addEventListener('beforeinstallprompt', (e) => {
    // Stop Chrome from showing default mini-infobar
    e.preventDefault();
    deferredPrompt = e;

    // Show your custom popup
    showInstallPopup();
  });

  function showInstallPopup() {
    if (document.getElementById('a2hs-popup')) return;

    const popup = document.createElement('div');
    popup.id = 'a2hs-popup';
    popup.innerHTML = `
      <div style="
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: #ffffff;
        box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        padding: 16px 20px;
        border-radius: 14px;
        z-index: 9999;
        max-width: 320px;
        text-align: center;
        font-family: sans-serif;
      ">
        <strong>Add JAJI'S to Home Screen</strong>
        <p style="font-size: 14px; margin: 8px 0;">
          Get faster access and app-like experience.
        </p>
        <button id="installBtn" style="
          background: #000;
          color: #fff;
          border: none;
          padding: 8px 16px;
          border-radius: 8px;
          cursor: pointer;
        ">
          Add Now
        </button>
        <button id="closeBtn" style="
          margin-left: 10px;
          background: transparent;
          border: none;
          font-size: 14px;
          cursor: pointer;
        ">
          Later
        </button>
      </div>
    `;
    document.body.appendChild(popup);

    document.getElementById('installBtn').onclick = async () => {
      popup.remove();
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      deferredPrompt = null;
    };

    document.getElementById('closeBtn').onclick = () => popup.remove();
  }
</script>
